name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Format
        run: cargo fmt -p agentpit -p agentpit-events --check

      - name: Clippy
        run: cargo clippy --workspace --exclude agentpit-dashboard --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude agentpit-dashboard --locked

  # The similarity feature (fastembed/ONNX) is off by default, so without this it would
  # never be linted or tested in CI. Tests never download the model — the embedder is
  # gated behind `agentpit similarity init` — so this stays network-free.
  #
  # Runs as its own job: building it on top of the workspace job's target/ starved the
  # hosted runner ("lost communication with the server") whenever the Cargo.lock cache
  # missed. Clippy alone is light (no codegen/link), but linking the ONNX-heavy test
  # binaries in parallel exhausts the runner's RAM — hence the swap file, -j 2, and the
  # build/run split so a future failure points at the guilty phase.
  similarity:
    name: clippy · test (similarity feature)
    runs-on: ubuntu-latest
    # The workflow-level timeout (not runner starvation) is what preserves logs when the
    # test phase wedges: these tests run in 11 s locally, so 20 min means "hung, kill it".
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space, add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          # The runner already has a busy 4G /swapfile — add ours on the ephemeral disk.
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sim-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sim-

      - name: Clippy (similarity)
        run: cargo clippy -p agentpit --features similarity --all-targets --locked -- -D warnings

      - name: Build tests (similarity)
        run: cargo test -p agentpit --features similarity --locked -j 2 --no-run

      # DEBUG round 2 (this branch only): first half of the suite (cli:: + exec::) plus the
      # test that hangs after them, with a memory monitor running alongside. Reproduces →
      # culprit is in cli::/exec::; memory lines show whether it's swap thrash.
      - name: Test (similarity)
        env:
          RUST_BACKTRACE: "1"
        run: |
          (while true; do echo "[mem] $(free -m | awk '/Mem:/ {print "used="$3"M avail="$7"M"} /Swap:/ {print "swap_used="$3"M"}' | tr '\n' ' ')"; sleep 15; done) &
          MONPID=$!
          timeout 600 cargo test -p agentpit --features similarity --locked -j 2 -- --test-threads=1 cli:: exec:: mcp::tools::tests::ask_human_times_out_to_sentinel_as_success || echo "EXIT CODE $? (124 = hung for 10 min)"
          kill $MONPID 2>/dev/null || true

      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  dashboard:
    name: frontend · fmt · clippy · test (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dashboard-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-dashboard-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Test and build dashboard frontend
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Format
        run: cargo fmt -p agentpit-dashboard --check

      - name: Clippy
        run: cargo clippy -p agentpit-dashboard --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p agentpit-dashboard --locked
