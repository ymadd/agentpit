name: release

# Recommended user flow:
#   gh release create vX.Y.Z --draft --target main --title "vX.Y.Z" --notes "..."
# The --draft flag means the release is never visible as "latest" until this
# workflow finishes uploading all assets, eliminating the brief window where
# `agentpit update` would see a released-but-empty tag.
#
# A non-draft `gh release create` also works: the prepare job flips it to
# draft at the start of the workflow. That still leaves a few-second window
# during which the release is published without assets — use --draft to
# avoid it entirely.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: prepare draft
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) name="$INPUT_TAG" ;;
            release)           name="$RELEASE_TAG" ;;
            *)                 name="${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Flip release to draft (if it already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --repo "$REPO"
            echo "Flipped existing release $TAG to draft."
          else
            echo "No existing release for $TAG — will be created by upload step."
          fi

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Build dashboard frontend
        # The dashboard's frontendDist is dashboard/frontend/dist — a Vite/React
        # bundle. tauri-build embeds it at compile time (plain cargo build, no
        # tauri-cli) and hard-fails if dist is missing, so it must be built
        # BEFORE the cargo step below.
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Build release binaries
        run: |
          cargo build -p agentpit --release --target ${{ matrix.target }} --locked
          cargo build -p agentpit-dashboard --release --target ${{ matrix.target }} --locked

      - name: Strip binary
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/agentpit || true
          strip target/${{ matrix.target }}/release/agentpit-dashboard || true

      - name: Prepare bundled CLI sidecar
        # Tauri resolves external binaries by the target-suffixed filename and
        # removes the suffix inside the installed application bundle.
        run: |
          mkdir -p dashboard/src-tauri/binaries
          cp \
            target/${{ matrix.target }}/release/agentpit \
            dashboard/src-tauri/binaries/agentpit-${{ matrix.target }}

      - name: Package binary (gzip only)
        # NOTE: We ship .gz (not .tar.gz). self_update detects .gz as
        # ArchiveKind::Plain(Gz) and streams the decompressed bytes straight
        # to bin_path_in_archive, bypassing the tar entry-name matching that
        # broke v0.1.5–v0.1.9 self-updates.
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          gzip -c agentpit > "../../../agentpit-${{ matrix.target }}.gz"
          gzip -c agentpit-dashboard > "../../../agentpit-dashboard-${{ matrix.target }}.gz"
          cd -
          shasum -a 256 "agentpit-${{ matrix.target }}.gz" > "agentpit-${{ matrix.target }}.gz.sha256"
          shasum -a 256 "agentpit-dashboard-${{ matrix.target }}.gz" > "agentpit-dashboard-${{ matrix.target }}.gz.sha256"

      - name: Upload to draft release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: true
          files: |
            agentpit-${{ matrix.target }}.gz
            agentpit-${{ matrix.target }}.gz.sha256
            agentpit-dashboard-${{ matrix.target }}.gz
            agentpit-dashboard-${{ matrix.target }}.gz.sha256
          fail_on_unmatched_files: true

      - name: Build and upload desktop installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dashboard
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: false
          args: --target ${{ matrix.target }} --config src-tauri/tauri.bundle.conf.json

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Flip release to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release edit "$TAG" \
            --draft=false \
            --latest \
            --repo "$REPO"
