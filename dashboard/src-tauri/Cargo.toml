[package]
name = "agentpit-dashboard"
version = "0.2.17"
edition = "2021"
description = "Desktop control plane for agentpit, with a bundled CLI"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "time"] }
notify = "6"
# Single source of truth for the event schema + state-dir paths, shared with the CLI.
agentpit-events = { path = "../../agentpit-events" }
# Comment-preserving TOML editor for the settings panel (round-trips config.toml verbatim).
toml_edit = "0.22"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
