name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Format
        run: cargo fmt -p agentpit -p agentpit-events --check

      - name: Clippy
        run: cargo clippy --workspace --exclude agentpit-dashboard --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude agentpit-dashboard --locked

  # The similarity feature (fastembed/ONNX) is off by default, so without this it would
  # never be linted or built in CI. Tests never download the model — the embedder is
  # gated behind `agentpit similarity init` — so this stays network-free.
  #
  # LINT + BUILD ONLY, deliberately. Running this suite on hosted runners starved the
  # runner to death ("lost communication", zero logs, even `timeout(1)` never fired)
  # 8 times on 2026-08-08 — yet a six-round bisect (closed PR #11) passed the identical
  # full suite in 27 s, and locally it runs in 11 s. Nondeterministic, environmental,
  # and expensive to keep chasing: the feature-gated tests themselves are six pure
  # arithmetic tests, so execution stays a local-gate concern. If this is revisited,
  # prefer cargo-nextest (per-test process isolation + per-test timeouts) so a hang
  # names its culprit instead of taking the runner down.
  similarity:
    name: clippy · build tests (similarity feature)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space, add swap
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          # The runner already has a busy 4G /swapfile — add ours on the ephemeral disk.
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          df -h /
          free -h

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-sim-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-sim-

      - name: Clippy (similarity)
        run: cargo clippy -p agentpit --features similarity --all-targets --locked -- -D warnings

      - name: Build tests (similarity)
        run: cargo test -p agentpit --features similarity --locked -j 2 --no-run

      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh target 2>/dev/null || true

  dashboard:
    name: frontend · fmt · clippy · test (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dashboard-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-dashboard-

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Test and build dashboard frontend
        working-directory: dashboard/frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Format
        run: cargo fmt -p agentpit-dashboard --check

      - name: Clippy
        run: cargo clippy -p agentpit-dashboard --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p agentpit-dashboard --locked
