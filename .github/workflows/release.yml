name: release

# Recommended user flow:
#   gh release create vX.Y.Z --draft --target main --title "vX.Y.Z" --notes "..."
# The --draft flag means the release is never visible as "latest" until this
# workflow finishes uploading all assets, eliminating the brief window where
# `agentpit update` would see a released-but-empty tag.
#
# A non-draft `gh release create` also works: the prepare job flips it to
# draft at the start of the workflow. That still leaves a few-second window
# during which the release is published without assets — use --draft to
# avoid it entirely.

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  prepare:
    name: prepare draft
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - name: Resolve tag
        id: tag
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) name="${{ github.event.inputs.tag }}" ;;
            release)           name="${{ github.event.release.tag_name }}" ;;
            *)                 name="${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Flip release to draft (if it already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.tag.outputs.name }}'
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --repo ${{ github.repository }}
            echo "Flipped existing release $TAG to draft."
          else
            echo "No existing release for $TAG — will be created by upload step."
          fi

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Strip binary
        if: runner.os != 'Windows'
        run: strip target/${{ matrix.target }}/release/agentpit || true

      - name: Package tarball
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          tar czf "../../../agentpit-${{ matrix.target }}.tar.gz" agentpit
          cd -
          shasum -a 256 "agentpit-${{ matrix.target }}.tar.gz" > "agentpit-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload to draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: true
          files: |
            agentpit-${{ matrix.target }}.tar.gz
            agentpit-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true

  publish:
    name: publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Flip release to published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit '${{ needs.prepare.outputs.tag }}' \
            --draft=false \
            --latest \
            --repo ${{ github.repository }}
