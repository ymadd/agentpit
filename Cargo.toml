[package]
name = "agentpit"
version = "0.1.4"
edition = "2024"
authors = ["yamato"]
license = "Apache-2.0"
description = "Multi-agent hub CLI: route work to Gemini / Claude / Codex / OpenCode backends."
repository = "https://github.com/ymadd/agentpit"
rust-version = "1.88.0"

[[bin]]
name = "agentpit"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "0.12"
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
cliclack = "0.5"
console = "0.15"
dirs = "5"
regex = "1"
self_update = { version = "0.44", features = ["archive-tar"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
