name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt · clippy · test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ci-

      - name: Format
        run: cargo fmt -p agentpit -p agentpit-events --check

      - name: Clippy
        run: cargo clippy --workspace --exclude agentpit-dashboard --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude agentpit-dashboard --locked

  dashboard:
    name: fmt · clippy · test (dashboard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-dashboard-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-dashboard-

      - name: Format
        run: cargo fmt -p agentpit-dashboard --check

      - name: Clippy
        run: cargo clippy -p agentpit-dashboard --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test -p agentpit-dashboard --locked
