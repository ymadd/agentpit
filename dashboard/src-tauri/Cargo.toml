[package]
name = "agentpit-dashboard"
version = "0.1.22"
edition = "2021"
description = "Live desktop dashboard for agentpit run activity"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
# Single source of truth for the event schema + state-dir paths, shared with the CLI.
agentpit-events = { path = "../../agentpit-events" }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
