[package]
name = "agentpit-events"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Shared run-event schema, state-dir paths, and capture for agentpit and its dashboard"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Session log ids: uuidv7 (time-sortable session ids) + v4 (entry-id entropy).
uuid = { version = "1", features = ["v4", "v7"] }
# RFC3339 timestamps in session entries without pulling in chrono.
humantime = "2"

[dev-dependencies]
tempfile = "3"
